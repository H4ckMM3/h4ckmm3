<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-labelledby="title desc">
<title id="title">Активность marin за последний год</title><desc id="desc">Вклады: 35, Коммиты: 32, Пул-реквесты: 0, Текущая серия: 1, Лучшая серия: 1</desc>
