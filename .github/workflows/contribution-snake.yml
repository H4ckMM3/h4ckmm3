name: Contribution snake

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/contribution-snake.yml
      - .github/scripts/render-language-card.py
      - .github/scripts/render-activity-panel.py

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Generate light and dark animation
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=%23a51f61&color_dots=%23fff4f9,%23f9c9df,%23f492bf,%23dc5397,%23ad2468
            dist/snake-dark.svg?palette=github-dark&color_snake=%23fff6fb&color_dots=%2353223e,%23943565,%23c85289,%23ee83b4,%23ffc3df
      - name: Generate top languages card
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_OWNER: ${{ github.repository_owner }}
        run: python3 .github/scripts/render-language-card.py "$PROFILE_OWNER" dist/top-languages.svg
      - name: Generate activity panels
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_OWNER: ${{ github.repository_owner }}
        run: python3 .github/scripts/render-activity-panel.py "$PROFILE_OWNER" dist
      - name: Publish profile graphics
        shell: bash
        run: |
          branch=snake-output
          if git ls-remote --exit-code --heads origin "refs/heads/$branch"; then
            git fetch --depth=1 origin "$branch"
            git switch -c "$branch" FETCH_HEAD
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              exit "$status"
            fi
            git switch --orphan "$branch"
          fi
          mv dist/snake-{light,dark}.svg dist/top-languages.svg dist/marin-{activity,calendar,languages}.svg .
          git add -- snake-light.svg snake-dark.svg top-languages.svg marin-activity.svg marin-calendar.svg marin-languages.svg
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Update profile graphics'
            git push origin "HEAD:refs/heads/$branch"
          fi
