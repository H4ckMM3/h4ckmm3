name: Contribution snake

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/contribution-snake.yml]

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Generate light and dark animation
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=%23000000&color_dots=%23ededed,%23c6c6c6,%23949494,%235b5b5b,%23232323
            dist/snake-dark.svg?palette=github-dark&color_snake=%23ffffff&color_dots=%23232323,%234a4a4a,%23777777,%23a5a5a5,%23d2d2d2
      - name: Generate top languages card
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_OWNER: ${{ github.repository_owner }}
        run: python3 .github/scripts/render-language-card.py "$PROFILE_OWNER" dist/top-languages.svg
      - name: Publish profile graphics
        shell: bash
        run: |
          branch=snake-output
          if git ls-remote --exit-code --heads origin "refs/heads/$branch"; then
            git fetch --depth=1 origin "$branch"
            git switch -c "$branch" FETCH_HEAD
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              exit "$status"
            fi
            git switch --orphan "$branch"
          fi
          mv dist/snake-{light,dark}.svg dist/top-languages.svg .
          git add -- snake-light.svg snake-dark.svg top-languages.svg
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Update profile graphics'
            git push origin "HEAD:refs/heads/$branch"
          fi
