<svg xmlns="http://www.w3.org/2000/svg" width="900" height="149" viewBox="0 0 900 149" role="img" aria-labelledby="title">
<title id="title">marin — инженер-программист, Python и DevOps</title>
<defs>
  <linearGradient id="paper"><stop stop-color="#fffafd"/><stop offset="1" stop-color="#fbddeb"/></linearGradient>
  <clipPath id="typing"><rect class="text-reveal" x="60" y="55" width="309" height="47"/></clipPath>
</defs>
<style>
@media (prefers-reduced-motion: no-preference) {
  .text-reveal { animation:typing 9s steps(22, end) infinite; }
  .cursor { animation:cursor 9s steps(22, end) infinite, blink 1.05s step-end infinite; }
  .signal { animation:breathe 2.6s ease-in-out infinite; transform-origin:108px 30px; }
  @keyframes typing { 0%,5% { width:0; } 30%,100% { width:309px; } }
  @keyframes cursor { 0%,5% { transform:translateX(-309px); } 30%,100% { transform:translateX(0); } }
  @keyframes blink { 50% { opacity:.25; } }
  @keyframes breathe { 50% { opacity:.15; transform:scale(1.45); } }
}
</style>
