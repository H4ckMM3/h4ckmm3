<svg xmlns="http://www.w3.org/2000/svg" width="900" height="206" viewBox="0 0 900 206" role="img" aria-labelledby="title desc">
  <title id="title">Рабочий фокус</title>
  <desc id="desc">Python — скрипты и инструменты. DevOps — автоматизация процессов разработки и инфраструктуры.</desc>
  <defs>
    <linearGradient id="paper"><stop stop-color="#fffafd"/><stop offset="1" stop-color="#f9deeb"/></linearGradient>
  </defs>
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .cursor { animation:blink 1.2s step-end infinite; }
      .meter { animation:signal 3.8s ease-in-out var(--delay) infinite; }
      @keyframes blink { 50% { opacity:.15; } }
      @keyframes signal { 0%,100% { opacity:.36; } 45% { opacity:1; } }
    }
  </style>
  <rect x="1" y="1" width="898" height="204" rx="23" fill="url(#paper)" stroke="#e6a1c2" stroke-width="2"/>
  <g font-family="system-ui,sans-serif">
    <text x="30" y="47" font-size="24" font-weight="750" fill="#902653">Рабочий фокус</text>
    <g transform="translate(30 67)">
      <rect width="411" height="110" rx="17" fill="#fff9fc" stroke="#edb4cf"/>
      <rect x="18" y="26" width="59" height="57" rx="13" fill="#f6d5e7"/>
      <path d="m31 47 10 8-10 8" fill="none" stroke="#a51f61" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
      <rect class="cursor" x="47" y="62" width="15" height="3" rx="1.5" fill="#a51f61"/>
      <text x="95" y="46" font-size="21" font-weight="750" fill="#902653">Python</text>
      <text x="95" y="71" font-size="15" fill="#79344f">Скрипты и инструменты</text>
    </g>
    <g transform="translate(459 67)">
      <rect width="411" height="110" rx="17" fill="#fff9fc" stroke="#edb4cf"/>
      <rect x="18" y="26" width="59" height="57" rx="13" fill="#f6d5e7"/>
      <g stroke="#a51f61" fill="none" stroke-width="2.2">
        <rect x="30" y="39" width="35" height="13" rx="4"/>
        <rect x="30" y="58" width="35" height="13" rx="4"/>
      </g>
      <g fill="#db4890">
        <circle class="meter" style="--delay:0s" cx="37" cy="45.5" r="2.5"/>
        <circle class="meter" style="--delay:-1.3s" cx="37" cy="64.5" r="2.5"/>
        <rect class="meter" style="--delay:-2.2s" x="45" y="44" width="13" height="3" rx="1.5"/>
        <rect class="meter" style="--delay:-.65s" x="45" y="63" width="13" height="3" rx="1.5"/>
      </g>
      <text x="95" y="46" font-size="21" font-weight="750" fill="#902653">DevOps</text>
      <text x="95" y="71" font-size="15" fill="#79344f">Автоматизация и инфраструктура</text>
